<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- MUST be the first meta — forces desktop 1280px viewport before any rendering -->
    <meta name="viewport" content="width=1280" />

    <title>Smart Mess Dashboard</title>

    <style>
      /* CSS-level lock — prevents mobile browsers from shrinking layout */
      html { min-width: 1280px; }
      body { min-width: 1280px; overflow-x: auto; }
      #root { min-width: 1280px; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
